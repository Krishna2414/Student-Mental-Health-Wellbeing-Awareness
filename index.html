<!doctype html>

  <head>

    <!-- Bootstrap CSS -->

        <a class="navbar-brand" href="#home">
          <img
            src="assets/images/student_mental_health_wellbeing_awareness_logo.png"

            class="logo"

        <!-- Mobile menu button -->

          type="button"
          data-bs-toggle="collapse"

        <div class="collapse navbar-collapse" id="mainNavigation">

            <a href="#" class="btn btn-primary-custom me-md-2"> Learn More </a>

            <a href="#" class="btn btn-secondary-custom"> Get Support </a>

          <!-- Hero image -->
          <div class="col-lg-6">
